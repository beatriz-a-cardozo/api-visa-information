name: CI - Build, Tests and Health Check

on:
  push:
  pull_request:

jobs:
  build-test-health:
    name: Build, Tests and Health Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./api-visa

    env:
      MONGODB_URI: mongodb://localhost:27017/visa_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-visa/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify

      - name: Start application
        run: |
          ./mvnw --batch-mode spring-boot:run > application.log 2>&1 &
          echo $! > application.pid

      - name: Verify health checker
        run: |
          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS http://localhost:8080/actuator/health || true)

            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Health check failed!"
          cat application.log
          exit 1

      - name: Show application logs on failure
        if: failure()
        run: |
          if [ -f application.log ]; then
            cat application.log
          fi
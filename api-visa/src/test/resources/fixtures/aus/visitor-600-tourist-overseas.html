<input type="hidden" name="ctl00$PlaceHolderMain$PageSchemaHiddenField$Input" id="ctl00_PlaceHolderMain_PageSchemaHiddenField_Input" value="{&quot;recommended&quot;:{&quot;cards&quot;:[]},&quot;visaSubclassHeading&quot;:&quot;Visitor visa (subclass 600)&quot;,&quot;title&quot;:&quot;Tourist stream (apply outside Australia)&quot;,&quot;currentActor&quot;:1,&quot;multipleActors&quot;:false,&quot;description&quot;:&quot;This visa stream lets you visit Australia as a tourist, to go on a cruise or to visit family and friends.&quot;,&quot;warning&quot;:&quot;&quot;,&quot;applicant&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Step by step&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you have this visa&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003eintend to come to Australia to visit only\u003c/li\u003e\n\t\u003cli\u003ehave enough money for your stay in Australia\u003c/li\u003e\n\t\u003cli\u003enot work in Australia\u003c/li\u003e\n\t\u003cli\u003eyou must be outside Australia when you apply and when we decide your visa\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch4\u003eHelp with your visa\u003c/h4\u003e\n\n\u003cp\u003eIf you are getting help with your visa, before you pay someone, read\u0026nbsp;information on \u003ca href=\&quot;/help-support/who-can-help-with-your-application/overview\&quot;\u003eWho can help with your visa application\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003e\u003ca class=\&quot;btn btn-block btn-cta\&quot; href=\&quot;https://online.immi.gov.au/elp/app?action=new\u0026amp;formId=VSS-AP-600\&quot; target=\&quot;_blank\&quot;\u003eApply\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003evisit family or friends\u003c/li\u003e\n\t\u003cli\u003ebe here as a tourist, for a cruise, or for purposes other than\u0026nbsp;business or medical treatment\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;visaStay&quot;:&quot;\u003cp\u003eUp to 12 months\u003c/p\u003e\n&quot;,&quot;visaCost&quot;:&quot;\u003cp\u003eFrom \u003cspan data-svpattribute=\&quot;BasePrice\&quot; data-svpproductcode=\&quot;6101\&quot; data-svpvisasubclasscode=\&quot;600-29B\&quot;\u003e\u0026nbsp;\u0026nbsp;\u003c/span\u003e (concessions\u0026nbsp;apply in limited circumstances).\u0026nbsp;\u003c/p\u003e\n\n\u003ch5\u003eCost concession\u003c/h5\u003e\n\n\u003cp\u003eFrom 1 July 2026, a lower visa cost applies to eligible Pacific Island and Timor-Leste citizens who lodge a valid visa application. See\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600/tourist-stream-overseas#About\&quot;\u003eAbout this visa\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eTo work out what your visa will cost, use the\u0026nbsp;\u003ca href=\&quot;/visas/visa-pricing-estimator\&quot;\u003eVisa Pricing Estimator\u003c/a\u003e.\u0026nbsp;The estimator does not take into account the other costs.\u003c/p\u003e\n&quot;,&quot;visaProcessingTime&quot;:&quot;\u003cp\u003eFor an indication of processing times for this visa, use the \u003ca href=\&quot;/_layouts/15/FIXUPREDIRECT.ASPX?WebId=1057a7be-45e1-4b08-af28-b81c4827a08c\u0026amp;TermSetId=a76074c9-979d-4db3-adcc-34af89495da2\u0026amp;TermId=8d21fa49-19a7-4d58-8bb0-31134b271c2b\&quot;\u003evisa processing time guide tool\u003c/a\u003e.\u0026#160;This will show the processing times for recently decided applications. It is a guide only and not specific to your application.\u003c/p\u003e\n&quot;,&quot;sellAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/see-your-visa-conditions?product=600-29B\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;withThisVisaHeading&quot;:&quot;With this visa you can&quot;,&quot;notesHeading&quot;:&quot;You must&quot;,&quot;seeAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=600-29B\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;With this visa you can&quot;,&quot;block&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003evisit family and/or friends\u003c/li\u003e\n\t\u003cli\u003ebe here as a tourist, for a cruise or for any purpose except business or medical treatment\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can study or train for up to 3 months on this visa. But if your main reason for travelling to Australia is study, a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/student-500\&quot;\u003estudent visa\u003c/a\u003e might be more appropriate.\u003c/p\u003e\n\n\u003cp\u003eYou can\u0026#39;t\u0026nbsp;\u003ca class=\&quot;clickbot-glossary\&quot;\u003ework\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eCruise\u003c/h3\u003e\n\n\u003cp\u003eYou will need a visa if you enter Australia during a cruise.\u003c/p\u003e\n\n\u003cp\u003eIf your cruise is a \u003ca class=\&quot;clickbot-glossary\&quot;\u003eround trip cruise\u003c/a\u003e, the time you spend on the cruise counts as time spent in Australia. We do not consider you to have left Australia. A round trip cruise will not reset your stay period on your visa.\u003c/p\u003e\n\n\u003cp\u003eAsk your cruise operator or travel agent if we consider your cruise to be a round trip cruise.\u003c/p\u003e\n&quot;},{&quot;text&quot;:&quot;How long you can stay&quot;,&quot;block&quot;:&quot;\u003cp\u003eThis is a temporary visa.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eYou can stay for the period or dates specified\u0026nbsp;on the visa grant letter. We determine the length of your visa\u0026nbsp;on a case by case basis. Things we might consider when determining your stay period include:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ehow long you want to stay\u003c/li\u003e\n\t\u003cli\u003ewhy you want to stay in Australia\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eWe might\u0026nbsp;not grant the length of stay you want.\u003c/p\u003e\n\n\u003cp\u003eWe can grant this visa with a single entry or multiple entry.\u003c/p\u003e\n\n\u003cp\u003eIf we grant you a visa with multiple entry, you can leave and return to Australia on the visa while it is valid.\u003c/p\u003e\n\n\u003cp\u003eGenerally, we grant a stay period of 3 months.\u0026nbsp;We might grant a stay of up to 12 months in certain circumstances.\u003c/p\u003e\n\n\u003ch3\u003e\u003cstrong\u003eParents of Australian citizens or permanent residents\u003c/strong\u003e\u003c/h3\u003e\n\n\u003cp\u003eIf you are the parent or step-parent of an Australian citizen or permanent resident, and you meet all the visa criteria, we may grant you a visa that is valid for more than 12 months.\u003c/p\u003e\n\n\u003cp\u003eWe consider these applications on a case-by-case basis.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eIf we grant you a visa that is valid for more than 12 months you might be able to enter Australia multiple times while the visa is valid. You can\u0026rsquo;t stay in Australia for more than 12 months in total in any 18 month period. You must also have made adequate arrangements for health insurance.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eIf you want to stay longer than 12 months on each visit you might be eligible for a \u003ca href=\&quot;https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/sponsored-parent-temporary-870#Overview\&quot;\u003eSponsored Parent (Temporary) visa\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Stay longer&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending this visa. You must apply for another visa in Australia.\u003c/p\u003e\n\n\u003cp\u003eYou can apply for a new visa if your current visa does not have a condition that prevents further stay, such as condition 8503 - No Further Stay. We can \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/waivers-and-permissions/no-further-stay-waiver\&quot;\u003ewaive a\u0026nbsp;no further stay condition\u003c/a\u003e in limited circumstances.\u003c/p\u003e\n\n\u003cp\u003eIf you want to stay longer or permanently in Australia you will need to apply for a visa that allows this.\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eExplore your visa options\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Include family&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t include family members in your application.\u003c/p\u003e\n\n\u003cp\u003eEach family member, including those listed on your passport, must submit a separate application.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Cost&quot;,&quot;block&quot;:&quot;\u003cp\u003eThis visa costs from \u003cspan data-svpattribute=\&quot;BasePrice\&quot; data-svpproductcode=\&quot;6101\&quot; data-svpvisasubclasscode=\&quot;600-29B\&quot;\u003e\u0026nbsp;\u003c/span\u003e for each applicant (concessions apply in limited circumstances).\u003c/p\u003e\n\n\u003cp\u003eYou might also have to pay other costs for:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ehealth checks\u003c/li\u003e\n\t\u003cli\u003epolice certificates\u003c/li\u003e\n\t\u003cli\u003ebiometrics\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eTo work out what your visa will cost use the\u0026nbsp;\u003ca href=\&quot;/visas/visa-pricing-estimator?visa=600-29B\&quot;\u003eVisa Pricing Estimator\u003c/a\u003e. The estimator does not take into account the other costs.\u003c/p\u003e\n\n\u003ch3\u003eCost concession\u0026nbsp;for eligible Pacific Island and Timor-Leste Visitor visa applicants\u003c/h3\u003e\n\n\u003cp\u003eFrom 1 July\u0026nbsp;2026, a lower visa cost applies to eligible Pacific Island and Timor-Leste citizens who lodge a valid visa application.\u003c/p\u003e\n\n\u003cp\u003eWe will charge eligible applicants the lower visa application cost\u0026nbsp;during the application process in\u0026nbsp;\u003ca aria-label=\&quot;ImmiAccount - external link\&quot; class=\&quot;external\&quot; href=\&quot;https://online.immi.gov.au/lusc/login\&quot;\u003eImmiAccount\u003c/a\u003e. We will recognise eligible applicants by the valid passport from the specified countries used in the application when they apply.\u003c/p\u003e\n\n\u003cp\u003eThe applicant must hold a valid passport issued by one of the following countries:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eFederated States of Micronesia\u003c/li\u003e\n\t\u003cli\u003eFiji\u003c/li\u003e\n\t\u003cli\u003eKiribati\u003c/li\u003e\n\t\u003cli\u003eNauru\u003c/li\u003e\n\t\u003cli\u003ePalau\u003c/li\u003e\n\t\u003cli\u003ePapua New Guinea\u003c/li\u003e\n\t\u003cli\u003eRepublic of the Marshall Islands\u003c/li\u003e\n\t\u003cli\u003eSamoa\u003c/li\u003e\n\t\u003cli\u003eSolomon Islands\u003c/li\u003e\n\t\u003cli\u003eTimor-Leste\u003c/li\u003e\n\t\u003cli\u003eTonga\u003c/li\u003e\n\t\u003cli\u003eTuvalu\u003c/li\u003e\n\t\u003cli\u003eVanuatu.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Apply outside Australia&quot;,&quot;block&quot;:&quot;\u003cp\u003eTo be eligible for this visa, you must be outside Australia when you apply and when we decide your application.\u003c/p\u003e\n\n\u003cp\u003eSee other \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600/tourist-stream-overseas#Eligibility\&quot;\u003eeligibility requirements\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Processing times&quot;,&quot;block&quot;:&quot;\u003cp\u003eFor an indication of processing times for this visa, use the \u003ca href=\&quot;/visas/getting-a-visa/visa-processing-times/global-visa-processing-times\&quot;\u003evisa processing time guide tool\u003c/a\u003e.\u0026nbsp;This will show the processing times for recently decided applications. It is a guide only and not specific to your application.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Your obligations&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou must comply with all visa conditions and Australian laws.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=600-29B\&quot;\u003evisa conditions\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Health insurance&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou are liable for all your healthcare costs while you are in Australia. Insurance can help limit your financial liability.\u0026nbsp;To cover any unexpected medical treatment you might need in Australia, we strongly recommended you take out \u003ca href=\&quot;/help-support/meeting-our-requirements/health/adequate-health-insurance\&quot;\u003eadequate health insurance\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca class=\&quot;external\&quot; href=\&quot;https://www.privatehealth.gov.au/health_insurance/overseas/index.htm\&quot; target=\&quot;_blank\&quot;\u003ehealth insurance for overseas visitors\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eSome countries have a \u003ca class=\&quot;external\&quot; href=\&quot;https://www.servicesaustralia.gov.au/individuals/services/medicare/reciprocal-health-care-agreements/when-you-visit-australia\&quot; target=\&quot;_blank\&quot;\u003ereciprocal healthcare agreement with Australia\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIn some circumstances, we might grant your visa with Condition 8501 \u0026ndash; Maintain adequate health insurance.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Travel&quot;,&quot;block&quot;:&quot;\u003cp\u003eCheck if you have multiple entry, or single entry, in\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e\u0026nbsp;or your visa grant letter.\u003c/p\u003e\n\n\u003cp\u003eIf\u0026nbsp;you have multiple entry, you can travel outside Australia and return while your visa is valid.\u003c/p\u003e\n\n\u003cp\u003eIf you have single entry and you leave Australia, you have to apply for another visa to return.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Visa label&quot;,&quot;block&quot;:&quot;\u003cp\u003eWe will digitally link your visa to your passport. You will not get a label in your passport.​​\u003c/p\u003e\n&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eYou must meet all of these criteria to be eligible for the Visitor visa Tourist stream (apply overseas).\u0026nbsp;\u003c/p\u003e\n&quot;},&quot;criteria&quot;:[{&quot;title&quot;:&quot;Meet our health requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/health\&quot;\u003ehealth requirement\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Meet our character requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/character\&quot;\u003echaracter requirement\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Pay your debts to the Australian government&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eIf you owe the Australian government money, you must have paid it back, or have arranged to pay it back.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Have enough money&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must have, or have access to, enough money to support yourself while you are in Australia.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Be a genuine visitor&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou must only intend\u0026nbsp;to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003estay temporarily in Australia\u003c/li\u003e\n\t\u003cli\u003eobey any condition and stay period attached to your visa\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Best interests of the child&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe might not grant this visa if it is not in the best interests of an applicant under 18.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;criteria&quot;:[]}]},&quot;stepGuide&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eFollow this step by step guide.\u003c/p\u003e\n&quot;},&quot;steps&quot;:[{&quot;id&quot;:1,&quot;title&quot;:&quot; Before you apply&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonLink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;id&quot;:2,&quot;collapsed&quot;:true,&quot;title&quot;:&quot;Check your passport&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou need a valid passport or other travel document for this visa. If you plan to get a new passport, do this before you apply.\u003c/p\u003e\n&quot;},{&quot;title&quot;:&quot;Organise health examinations&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou can complete your health examinations before you apply or you can wait until we tell you to have them.\u003c/p\u003e\n\n\u003cp\u003eFind out the\u003ca href=\&quot;/help-support/meeting-our-requirements/health\&quot;\u003e examinations you might need\u003c/a\u003e\u0026nbsp;and how to arrange them.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Get help with your application&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eOnly some people can help you with your application. If you appoint someone to give you immigration assistance they must be:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea \u003ca href=\&quot;/help-support/who-can-help-with-your-application/using-a-migration-agent\&quot;\u003eregistered migration agent\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003ea \u003ca href=\&quot;/help-support/who-can-help-with-your-application/using-a-legal-practitioner\&quot;\u003elegal practitioner\u003c/a\u003e, or\u003c/li\u003e\n\t\u003cli\u003ean \u003ca href=\&quot;/help-support/who-can-help-with-your-application/exempt-person\&quot;\u003eexempt person\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can appoint anyone to \u003ca href=\&quot;/help-support/who-can-help-with-your-application/authorised-recipents\&quot;\u003ereceive documents\u003c/a\u003e on your behalf relating to your visa matter.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;id&quot;:3,&quot;title&quot;:&quot;Gather your documents&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eInclude as much information as possible to support your application. This includes English translations of your documents.\u003c/p\u003e\n\n\u003cp\u003eWe may decide your application without requesting further information from you.\u003c/p\u003e\n\n\u003cp\u003eFollow these instructions to ensure you submit a complete visa application\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonlink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;title&quot;:&quot;Provide accurate information&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eProvide accurate information.\u003c/p\u003e\n\n\u003cp\u003eSee what happens if you \u003ca href=\&quot;/help-support/meeting-our-requirements/providing-accurate-information\&quot;\u003ecan\u0026#39;t prove your identity or don\u0026#39;t provide true information\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Identity documents&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eProvide the pages of your current passport showing your photo, personal details and passport issue and expiry dates.\u003c/p\u003e\n\n\u003cp\u003eAlso provide:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea national identity card, if you have one\u003c/li\u003e\n\t\u003cli\u003eproof of change of name, if applicable, such as:\n\t\u003cul\u003e\n\t\t\u003cli\u003ea marriage or divorce certificate\u003c/li\u003e\n\t\t\u003cli\u003echange of name documents from an Australian Registry of Births, Deaths and Marriages, or the relevant overseas authority\u003c/li\u003e\n\t\t\u003cli\u003edocuments that show other names you have been known by\u003c/li\u003e\n\t\u003c/ul\u003e\n\t\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Genuine visitor documents&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eProvide as much proof as you can to show you are visiting Australia as a temporary visitor only. This could include:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eproof you have enough money for your stay and to leave Australia, such as:\n\t\u003cul\u003e\n\t\t\u003cli\u003eitemised personal bank statements for a 3 month period\u003c/li\u003e\n\t\t\u003cli\u003epay slips\u003c/li\u003e\n\t\t\u003cli\u003eaudited accounts\u003c/li\u003e\n\t\t\u003cli\u003etax records\u003c/li\u003e\n\t\t\u003cli\u003eterm deposits\u003c/li\u003e\n\t\t\u003cli\u003ecredit card statements\u003c/li\u003e\n\t\u003c/ul\u003e\n\t\u003c/li\u003e\n\t\u003cli\u003ea letter from your relative or friend in Australia, inviting you to visit. The letter could state:\n\t\u003cul\u003e\n\t\t\u003cli\u003etheir relationship to you\u003c/li\u003e\n\t\t\u003cli\u003ethe purpose of your visit and length of stay\u003c/li\u003e\n\t\t\u003cli\u003eif you will be staying with them\u003cbr /\u003e\n\t\tIf this person will be paying for your stay, provide proof of their funds.\u003c/li\u003e\n\t\u003c/ul\u003e\n\t\u003c/li\u003e\n\t\u003cli\u003eyour plans while in Australia\u003cbr /\u003e\n\t\u0026nbsp;\u003c/li\u003e\n\t\u003cli\u003eproof that you have reasons to return home such as:\n\t\u003cul\u003e\n\t\t\u003cli\u003ea letter from your employer stating you plan to return to your job\u003c/li\u003e\n\t\t\u003cli\u003eproof that you study at a school, college or university in your home country\u003c/li\u003e\n\t\t\u003cli\u003eproof that you have immediate family members in your home country\u003c/li\u003e\n\t\t\u003cli\u003eproof that you can return home\u003c/li\u003e\n\t\t\u003cli\u003eproof that you own a house or other major assets in your home country\u003c/li\u003e\n\t\u003c/ul\u003e\n\t\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Character documents&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eProvide any military service record or discharge papers, if applicable.\u003c/p\u003e\n\n\u003cp\u003eWe may ask you to provide a \u003ca href=\&quot;/help-support/meeting-our-requirements/character\&quot;\u003epolice certificate\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Tell us you are getting help&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eTo nominate someone to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ereceive your correspondence, use\u0026nbsp;\u003ca data-getfilesize=\&quot;/form-listing/forms/956a.pdf\&quot; href=\&quot;/form-listing/forms/956a.pdf\&quot;\u003eForm 956A Appointment or withdrawal of an authorised recipient\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003eprovide immigration assistance, use\u0026nbsp;\u003ca data-getfilesize=\&quot;/form-listing/forms/956.pdf\&quot; href=\&quot;/form-listing/forms/956.pdf\&quot;\u003eForm 956 Appointment of a registered migration agent, legal practitioner or exempt person\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eUpload your written notification or your forms to\u0026nbsp;\u003ca href=\&quot;/help-support/applying-online-or-on-paper/overview\&quot;\u003eImmiAccount\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Additional documents for applicants requesting a longer visa&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you are requesting a longer visa, tell us in your application. This includes parents and step-parents of Australian citizens or permanent residents.\u003c/p\u003e\n\n\u003cp\u003eProvide us with further information about the reason for your request.\u003c/p\u003e\n\n\u003cp\u003eFor example, proof that your child is an Australian citizen or permanent resident.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Additional documents for applicants under 18&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you are under the age of 18, you should provide a copy of your birth certificate showing the names of both parents. If you can\u0026rsquo;t provide a birth certificate, provide one of the following:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eidentification pages of a family book showing the names of both parents\u003c/li\u003e\n\t\u003cli\u003eidentification pages of an identification document issued by the government\u003c/li\u003e\n\t\u003cli\u003eidentification pages of a court-issued document that proves your identity\u003c/li\u003e\n\t\u003cli\u003eidentification pages of a family census register\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf somebody other than your biological parents has legal guardianship over you (for example, adoptive parents or a court-appointed guardian), you must provide proof of their legal guardianship.\u003c/p\u003e\n\n\u003cp\u003eProvide adoption papers or parental court orders, if applicable.\u003c/p\u003e\n\n\u003cp\u003eAnyone with a legal right to decide where you live, and who is not travelling in Australia with you, must complete either:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003e\u003ca data-getfilesize=\&quot;/form-listing/forms/1229.pdf\&quot; href=\&quot;/form-listing/forms/1229.pdf\&quot;\u003eForm 1229 - Consent form to grant an Australian visa to a child under the age of 18 years\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003ea statutory declaration giving their consent for the child to visit Australia on this visa\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cul\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eInclude a document with the signature and photo of the person who completed, or declaration, such as a:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003epassport\u003c/li\u003e\n\t\u003cli\u003edriver\u0026rsquo;s licence\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIn addition to consent information, if you\u0026rsquo;re not staying with a relative or legal guardian, provide\u0026nbsp;\u003ca data-getfilesize=\&quot;/form-listing/forms/1257.pdf\&quot; href=\&quot;/form-listing/forms/1257.pdf\&quot;\u003eForm 1257 - Undertaking declaration\u003c/a\u003e. The person you\u0026#39;re staying with must sign the form.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Prepare your documents&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[{&quot;title&quot;:&quot;Translate&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eHave all non-English documents translated into English.\u003c/p\u003e\n\n\u003cp\u003eProvide original and translated documents in your application.\u003c/p\u003e\n\n\u003cp\u003eTranslators in Australia must be accredited by the\u0026nbsp;\u003ca class=\&quot;external-link\&quot; href=\&quot;https://www.naati.com.au/\&quot; target=\&quot;_blank\&quot;\u003eNational Accreditation Authority for Translators and Interpreters\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eTranslators outside Australia do not have to be accredited. But on each translation, they must include their:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003efull name\u003c/li\u003e\n\t\u003cli\u003eaddress and telephone number\u003c/li\u003e\n\t\u003cli\u003equalifications and experience in the language they are translating\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThese details must be in English.\u003c/p\u003e\n\n\u003cp\u003eYou do not need to have any documents certified unless we ask you to.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Scan or photograph&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eScan or photograph all documents (English and non-English) in colour.\u003c/p\u003e\n\n\u003cp\u003eThe scans and photos must be clear and\u0026nbsp;legible.\u003c/p\u003e\n\n\u003cp\u003eIf a document is more than one page, save it all as one file.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]}]},{&quot;title&quot;:&quot;Apply for the visa&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[{&quot;title&quot;:&quot;Provide accurate information&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eProvide accurate information.\u003c/p\u003e\n\n\u003cp\u003eSee what happens if you\u0026nbsp;\u003ca href=\&quot;/help-support/meeting-our-requirements/providing-accurate-information\&quot;\u003ecan\u0026#39;t prove your identity or don\u0026#39;t provide true information\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Apply online&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003col\u003e\n\t\u003cli\u003eLog in or create an\u0026nbsp;\u003ca href=\&quot;https://online.immi.gov.au/ola/app\&quot;\u003eImmiAccount\u003c/a\u003e.\u003c/li\u003e\n\t\u003cli\u003e\u003ca href=\&quot;/help-support/applying-online-or-on-paper/online\&quot;\u003eAttach documents\u003c/a\u003e.\u003c/li\u003e\n\t\u003cli\u003e\u003ca href=\&quot;/help-support/applying-online-or-on-paper/online\&quot;\u003eSubmit family applications together\u003c/a\u003e.\u003c/li\u003e\n\t\u003cli\u003e\u003ca href=\&quot;/help-support/applying-online-or-on-paper/online/how-to-pay\&quot;\u003e​Pay the application fee\u003c/a\u003e. We will not process your application until you pay the fee.\u003c/li\u003e\n\u003c/ol\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;title&quot;:&quot;After you apply&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know when we have received your application and documents.\u003c/p\u003e\n\n\u003cp\u003eThere are other things you need to know and might need to do.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[{&quot;title&quot;:&quot;Travel&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you applied from outside Australia you must be outside Australia when we decide your visa. Do not arrange to travel to Australia until we let you know, in writing, that we have granted you the visa.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Biometrics&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know if you need to provide \u003ca href=\&quot;/help-support/meeting-our-requirements/biometrics\&quot;\u003ebiometrics\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Health examinations&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you didn\u0026#39;t have health examinations\u0026nbsp;before you applied for the visa, have them if we tell you to.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Attach more information&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you did not attach\u0026nbsp;all documents when you applied, or if we ask you for more documents, attach\u0026nbsp;them as soon as you can in\u0026nbsp;ImmiAccount .\u003c/p\u003e\n\n\u003cp\u003eWe may decide your application without requesting further information from you.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Mistakes on your application&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eLet us know as soon as you can if you made a mistake on your application.\u003c/p\u003e\n\n\u003cp\u003eFind out what to do if you made a mistake on your \u003ca href=\&quot;/help-support/applying-online-or-on-paper/online\&quot;\u003eonline application\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Help with your application&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eLet us know if you no longer want someone to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ereceive your correspondence - complete\u0026nbsp;\u003ca data-getfilesize=\&quot;/form-listing/forms/956a.pdf\&quot; href=\&quot;/form-listing/forms/956a.pdf\&quot;\u003eForm 956A Appointment or withdrawal of an authorised recipient\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003eprovide immigration advice - complete\u0026nbsp;\u003ca data-getfilesize=\&quot;/form-listing/forms/956.pdf\&quot; href=\&quot;/form-listing/forms/956.pdf\&quot;\u003eForm 956 Appointment of a registered migration agent, legal practitioner or exempt person\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eUpload your written notification or your forms to\u0026nbsp;\u003ca href=\&quot;/help-support/applying-online-or-on-paper/overview\&quot;\u003eImmiAccount\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eFor more information see \u003ca href=\&quot;/help-support/who-can-help-with-your-application/overview\&quot;\u003eWho can help you with your application\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Tell us if things change&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/change-in-situation\&quot;\u003eTell us if things change\u003c/a\u003e after you submit\u0026nbsp;your application but before we have made a decision.\u0026nbsp;\u003c/p\u003e\n\n\u003cp\u003eThings you need to let us know about include:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyou want to withdraw your application\u003c/li\u003e\n\t\u003cli\u003echanges to your phone number, address or passport\u003c/li\u003e\n\t\u003cli\u003echanges to your relationship status\u003c/li\u003e\n\t\u003cli\u003ethe birth of a child\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;title&quot;:&quot;Visa outcome&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know our decision on your visa application in writing. We will tell you:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyour visa grant number\u003c/li\u003e\n\t\u003cli\u003ethe date your visa starts\u003c/li\u003e\n\t\u003cli\u003eyour visa conditions\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eKeep a copy of our decision with you when in Australia.\u003c/p\u003e\n\n\u003cp\u003eIf we refuse your visa we will let you know in writing. We will tell you why we refused your visa and whether you have a right to a review of the decision.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;Step Summary&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}],&quot;collapsed&quot;:false},&quot;haveThisVisa&quot;:{&quot;content&quot;:[{&quot;id&quot;:-1,&quot;text&quot;:&quot;Coming to Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eBefore you travel\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eCheck your travel documents\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eYou must have:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea valid visa to enter Australia\u003c/li\u003e\n\t\u003cli\u003ea valid passport or other travel document\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eComplete an Incoming Passenger Card\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eEveryone who arrives in Australia must complete an \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/entering-and-leaving-australia/crossing-the-border/at-the-border/incoming-passenger-card-(ipc)\&quot;\u003eIncoming Passenger Card\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eUsing the SmartGate\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eA SmartGate is an automated process that uses facial recognition technology and your ePassport. You might be able to leave the airport faster if you use \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/smartgates\&quot;\u003eSmartGate\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;In Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eWhat you must do on your visa\u003c/h3\u003e\n\n\u003cp\u003eYou must meet all visa conditions and obey Australian laws. See your conditions in \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e or your visa grant letter.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=600-29B\&quot;\u003evisa conditions\u003c/a\u003e and how they work.\u003c/p\u003e\n\n\u003ch3\u003eTell us about a change in your situation\u003c/h3\u003e\n\n\u003cp\u003eThings you need to let us know about include:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003echanges to your phone number, email, address or passport\u003c/li\u003e\n\t\u003cli\u003echanges to your relationship status\u003c/li\u003e\n\t\u003cli\u003ethe birth of a child\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eSee how to let us know if there is a \u003ca href=\&quot;/change-in-situation\&quot;\u003echange in your situation\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eWhat you can do on your visa\u003c/h3\u003e\n\n\u003cp\u003eThis visa lets you:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ecruise or have a holiday\u003c/li\u003e\n\t\u003cli\u003evisit family or friends\u003c/li\u003e\n\t\u003cli\u003estudy or train for up to 3 months\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eVolunteer work tourism schemes\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eYou can\u0026#39;t work in Australia on a Visitor visa, but you might be able to do\u0026nbsp;\u003ca class=\&quot;clickbot-glossary\&quot;\u003evolunteer work\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eTravel on your visa\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eWe grant the visa with either:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003esingle entry - if you leave Australia, you cannot re-enter Australia on the visa, or\u003c/li\u003e\n\t\u003cli\u003emultiple entry - you can leave and re-enter Australia as many times as you want while the visa is valid\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eSee how long you can stay\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eSee when you must leave in \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eStay\u0026nbsp;longer\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending this visa. You must apply for a new visa if you want to stay longer. \u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eSee your options\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eProve you have a visa\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003eTo prove you have a visa and show your conditions to someone, use \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Leaving Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eBefore you leave\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eCheck your travel documents\u003c/strong\u003e\u003cbr /\u003e\nYou must have a valid passport or other travel document to leave Australia.\u003c/p\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eDepartures SmartGate\u003c/strong\u003e\u003cbr /\u003e\nWe have an automated process that uses facial recognition technology and your ePassport. You might be able to leave the airport faster if you use \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/smartgates\&quot;\u003eSmartGate\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eAfter you leave\u003c/h3\u003e\n\n\u003cp\u003e\u003cstrong\u003eInternational Movement Record\u0026nbsp;\u003c/strong\u003e\u003cbr /\u003e\nTo prove you have been to Australia, request your international movement records by completing a \u003ca href=\&quot;/help-support/departmental-forms/online-forms/request-international-movement-records\&quot;\u003eRequest for international movement records\u003c/a\u003e form.\u003c/p\u003e\n&quot;}]}},&quot;sponsor&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;How to Apply&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you are a sponsor&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;sponsor things to note&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;With this visa, they can...&quot;,&quot;visaStay&quot;:&quot;This is a permanent visa. You can stay in Australia indefinitely&quot;,&quot;visaCost&quot;:&quot;sponsor visa cost&quot;,&quot;visaProcessingTime&quot;:&quot;\u003cp\u003eWe process:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003e75% of applications in \u003cspan data-gptattribute=\&quot;Percent75\&quot; data-gptstreamcode=\&quot;29\&quot; data-gptvisasubclasscode=\&quot;600\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\t\u003cli\u003e90% of applications in \u003cspan data-gptattribute=\&quot;Percent90\&quot; data-gptstreamcode=\&quot;29\&quot; data-gptvisasubclasscode=\&quot;600\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;Anchor Content 1&quot;,&quot;block&quot;:&quot;Block 1&quot;},{&quot;text&quot;:&quot;Anchor Content 2&quot;,&quot;block&quot;:&quot;Block 2&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\n        You must meet all of the following eligibility criteria to be eligible for

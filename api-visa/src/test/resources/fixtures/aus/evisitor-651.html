<input type="hidden" name="ctl00$PlaceHolderMain$PageSchemaHiddenField$Input" id="ctl00_PlaceHolderMain_PageSchemaHiddenField_Input" value="{&quot;recommended&quot;:{&quot;cards&quot;:[{&quot;id&quot;:&quot;600-29B&quot;,&quot;itemName&quot;:&quot;600-29B&quot;}]},&quot;visaSubclassHeading&quot;:&quot;Subclass 651&quot;,&quot;title&quot;:&quot;eVisitor&quot;,&quot;currentActor&quot;:1,&quot;multipleActors&quot;:false,&quot;description&quot;:&quot;Visit Australia as often as you wish in a 12-month period. Stay up to 3 months each time you enter Australia.\n&quot;,&quot;warning&quot;:&quot;&quot;,&quot;applicant&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Step by step&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you have this visa&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003eapply from outside Australia\u003c/li\u003e\n\t\u003cli\u003ehold a passport from a particular country\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003ca class=\&quot;btn btn-block btn-cta\&quot; href=\&quot;https://online.immi.gov.au/elp/app?action=new\u0026amp;formId=TV-AP-651\&quot; target=\&quot;_blank\&quot;\u003eApply\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003evisit family or friends\u003c/li\u003e\n\t\u003cli\u003ecruise or have a holiday\u003c/li\u003e\n\t\u003cli\u003eundertake\u0026nbsp;\u003ca class=\&quot;clickbot-glossary\&quot;\u003ebusiness visitor activities\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003estudy or train for up to 3 months, in some circumstances\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;visaStay&quot;:&quot;\u003cp\u003eUp to 3 months at a time\u003c/p\u003e\n&quot;,&quot;visaCost&quot;:&quot;Free&quot;,&quot;visaProcessingTime&quot;:&quot;\u003cp\u003eFor an indication of processing times for this visa, use the \u003ca href=\&quot;/_layouts/15/FIXUPREDIRECT.ASPX?WebId=1057a7be-45e1-4b08-af28-b81c4827a08c\u0026amp;TermSetId=a76074c9-979d-4db3-adcc-34af89495da2\u0026amp;TermId=8d21fa49-19a7-4d58-8bb0-31134b271c2b\&quot;\u003evisa processing time guide tool\u003c/a\u003e. This will show the processing times for recently decided applications. It is a guide only and not specific to your application.\u003c/p\u003e\n&quot;,&quot;sellAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/see-your-visa-conditions?product=651\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;seeAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=651\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;withThisVisaHeading&quot;:&quot;With this visa you can&quot;,&quot;notesHeading&quot;:&quot;You must&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;With this visa you can&quot;,&quot;block&quot;:&quot;\u003ch3\u003eTravel to Australia:\u003c/h3\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eas a tourist - for example,\u0026nbsp;to cruise or have a holiday\u0026nbsp;\u003c/li\u003e\n\t\u003cli\u003eto visit family or friends\u003c/li\u003e\n\t\u003cli\u003eas a business visitor\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can study or train for up to 3 months in total on this visa. But if your main reason for travelling to Australia is study, a student visa might be more appropriate.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eNote\u003c/strong\u003e: Applicants who are seeking to train at a childcare centre, study to be a doctor, dentist, nurse or paramedic or enter health care or hospital environments should apply for the Visitor (subclass 600) visa and complete the relevant health checks.\u003c/p\u003e\n\n\u003ch3\u003eCruise\u003c/h3\u003e\n\n\u003cp\u003eYou will need a visa if you enter Australia during a cruise.\u003c/p\u003e\n\n\u003cp\u003eIf your cruise is a \u003ca class=\&quot;clickbot-glossary\&quot;\u003eround trip cruise\u003c/a\u003e, the time you spend on the cruise counts as time spent in Australia - that is, we do not consider you have left Australia. A round trip cruise will not reset your stay period on your visa.\u003c/p\u003e\n\n\u003cp\u003eAsk your cruise operator or travel agent if we consider your cruise to be a round trip cruise.\u003c/p\u003e\n\n\u003ch3\u003eBusiness visitor\u003c/h3\u003e\n\n\u003cp\u003eAs a business visitor, you can:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003emake general business or employment enquiries\u003c/li\u003e\n\t\u003cli\u003einvestigate, negotiate, enter into or review a business contract\u003c/li\u003e\n\t\u003cli\u003econduct activities as part of an official government visit\u003c/li\u003e\n\t\u003cli\u003etake part in a conference, trade fair or seminar. The organisers can\u0026#39;t pay you to take part\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can\u0026#39;t:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ework for or provide services to a business or organisation based in Australia\u003c/li\u003e\n\t\u003cli\u003esell goods or services directly to the public\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe eVisitor visa is not a work visa. You cannot perform paid work for an Australian employer. If you work or intend to work in Australia on an eVisitor visa, \u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ewe may cancel it\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eWe may remove you or refuse you entry to Australia.\u003c/p\u003e\n\n\u003cp\u003eTo work in Australia, you must hold an appropriate visa. See \u003ca href=\&quot;/visas/working-in-australia\&quot;\u003eWorking in Australia\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;text&quot;:&quot;How long you can stay&quot;,&quot;block&quot;:&quot;\u003cp\u003eThis is a temporary visa. The eVisitor visa is valid for travel to Australia for 12 months, starting from the date it is granted.\u003c/p\u003e\n\n\u003cp\u003eThe visa has multiple entry . You can leave and re-enter Australia as many times as you want while it is valid. You can stay in Australia for 3 months after each entry. If you want to stay longer than 3 months at a time, you must apply for a different visa that suits your circumstances.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia for long periods or make regular visits , we may ask you about your travel purpose next time you enter Australia. If we find you are not a genuine visitor, we may \u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancel\u003c/a\u003e your eVisitor visa.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Stay longer&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending this visa. You must apply for another visa.\u003c/p\u003e\n\n\u003cp\u003eIf you want to have a further short stay or stay longer for a holiday you might be eligible for a\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600/tourist-stream-onshore\&quot;\u003eVisitor visa (subclass 600) Tourist stream (apply in Australia)\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you want to stay longer for other reasons, you should be able to apply for a new visa that suits your circumstances.\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eExplore your visa options\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia after your eVisitor visa ceases, and do not hold another visa to stay, you will become an unlawful non-citizen. We may remove you from Australia.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Include family&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t include family members in your application. A separate application must be made for each member of your family, including those listed on your passport.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Cost&quot;,&quot;block&quot;:&quot;\u003cp\u003eThe eVisitor is free.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Apply from&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou must be outside Australia when you apply.\u003c/p\u003e\n\n\u003cp\u003eDo not arrange to travel to Australia until we let you know, in writing, that we have granted you the subclass 651 visa.\u003c/p\u003e\n\n\u003cp\u003eYou must be outside Australia when we decide on your application.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Processing times&quot;,&quot;block&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003e25% of applications: \u003cspan data-gptattribute=\&quot;Percent25\&quot; data-gptvisasubclasscode=\&quot;651\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\t\u003cli\u003e50% of applications: \u003cspan data-gptattribute=\&quot;Percent50\&quot; data-gptvisasubclasscode=\&quot;651\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\t\u003cli\u003e75% of applications: \u003cspan data-gptattribute=\&quot;Percent75\&quot; data-gptvisasubclasscode=\&quot;651\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\t\u003cli\u003e90% of applications: \u003cspan data-gptattribute=\&quot;Percent90\&quot; data-gptvisasubclasscode=\&quot;651\&quot;\u003e\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Your obligations&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou must meet all visa conditions and obey Australian laws.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Health insurance&quot;,&quot;block&quot;:&quot;\u003cp\u003eWe recommend you take out health insurance to cover any unforeseen medical treatment you might need in Australia. You are personally liable for all your healthcare costs while you are in Australia. Insurance can help limit your financial liability.\u003c/p\u003e\n\n\u003cp\u003eSee what we consider \u003ca href=\&quot;/help-support/meeting-our-requirements/health/adequate-health-insurance\&quot;\u003eadequate health insurance\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca class=\&quot;external\&quot; href=\&quot;https://www.privatehealth.gov.au/health_insurance/overseas/index.htm\&quot;\u003ehealth insurance for overseas visitors\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eReciprocal healthcare agreements\u003c/h3\u003e\n\n\u003cp\u003eSome countries have a reciprocal healthcare agreement with Australia. Find out more from Services Australia about \u003ca class=\&quot;external\&quot; href=\&quot;https://www.servicesaustralia.gov.au/when-reciprocal-health-care-agreements-apply-and-you-visit-australia?context=22481\&quot;\u003ereciprocal healthcare agreements\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Travel&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can travel outside Australia and return as many times as you want while the\u0026nbsp;eVisitor is valid.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Visa label&quot;,&quot;block&quot;:&quot;\u003cp\u003eWe will digitally link your visa to your passport. You will not get a label in your passport.​​\u003c/p\u003e\n&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eYou must meet all of these criteria to be eligible for the eVisitor.\u003c/p\u003e\n&quot;},&quot;criteria&quot;:[{&quot;title&quot;:&quot;Have an eligible passport&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou must be a citizen of and hold a valid passport from one of these countries to be eligible for the eVisitor:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eAndorra\u003c/li\u003e\n\t\u003cli\u003eAustria\u003c/li\u003e\n\t\u003cli\u003eBelgium\u003c/li\u003e\n\t\u003cli\u003eBulgaria\u003c/li\u003e\n\t\u003cli\u003eCroatia\u003c/li\u003e\n\t\u003cli\u003eCyprus\u003c/li\u003e\n\t\u003cli\u003eCzech Republic\u003c/li\u003e\n\t\u003cli\u003eDenmark\u003c/li\u003e\n\t\u003cli\u003eEstonia\u003c/li\u003e\n\t\u003cli\u003eFinland\u003c/li\u003e\n\t\u003cli\u003eFrance\u003c/li\u003e\n\t\u003cli\u003eGermany\u003c/li\u003e\n\t\u003cli\u003eGreece\u003c/li\u003e\n\t\u003cli\u003eHungary\u003c/li\u003e\n\t\u003cli\u003eIceland\u003c/li\u003e\n\t\u003cli\u003eIreland\u003c/li\u003e\n\t\u003cli\u003eItaly\u003c/li\u003e\n\t\u003cli\u003eLatvia\u003c/li\u003e\n\t\u003cli\u003eLiechtenstein\u003c/li\u003e\n\t\u003cli\u003eLithuania\u003c/li\u003e\n\t\u003cli\u003eLuxembourg\u003c/li\u003e\n\t\u003cli\u003eMalta\u003c/li\u003e\n\t\u003cli\u003eMonaco\u003c/li\u003e\n\t\u003cli\u003eThe Netherlands\u003c/li\u003e\n\t\u003cli\u003eNorway\u003c/li\u003e\n\t\u003cli\u003ePoland\u003c/li\u003e\n\t\u003cli\u003ePortugal\u003c/li\u003e\n\t\u003cli\u003eRomania\u003c/li\u003e\n\t\u003cli\u003eRepublic of San Marino\u003c/li\u003e\n\t\u003cli\u003eSlovakia\u003c/li\u003e\n\t\u003cli\u003eSlovenia\u003c/li\u003e\n\t\u003cli\u003eSpain\u003c/li\u003e\n\t\u003cli\u003eSweden\u003c/li\u003e\n\t\u003cli\u003eSwitzerland\u003c/li\u003e\n\t\u003cli\u003eUnited Kingdom \u0026ndash; British Citizen\u003c/li\u003e\n\t\u003cli\u003eVatican City - passport \u003cu\u003emust\u003c/u\u003e\u0026nbsp;indicate that you are a national of the Vatican City (Holy See)\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou cannot apply with:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea non-citizen passport, certificate of identity or other travel document including a Titre de Voyage, or\u003c/li\u003e\n\t\u003cli\u003ea British National Overseas, British Dependent Territories Citizen, British Overseas Citizen, British Protected Person or British Subject passport\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Meet our health requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/health\&quot;\u003ehealth requirement\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eWhere a visa applicant has previously\u0026nbsp;\u003cstrong\u003efailed to meet\u0026nbsp;\u003c/strong\u003ethe \u003ca href=\&quot;https://immi.homeaffairs.gov.au/help-support/meeting-our-requirements/health\&quot; target=\&quot;_blank\&quot;\u003ehealth requirement\u003c/a\u003e, the most appropriate visa for these applicants is a \u003ca href=\&quot;https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/visitor-600\&quot;\u003eVisitor (subclass 600) visa.\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Meet our character requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/character\&quot;\u003echaracter requirement\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you have a criminal conviction in any country, apply for a Visitor visa (subclass 600) instead. If you arrive in Australia on an eVisitor with a criminal conviction, you might be refused entry.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Pay your debts to the Australian Government&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eIf you or any family members (including those who don\u0026#39;t apply for the visa with you) owe the Australian Government money, you or they must have paid it back or arranged to pay it back.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Be a genuine visitor&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must only intend\u0026nbsp;to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003estay temporarily in Australia\u003c/li\u003e\n\t\u003cli\u003eobey any condition and stay period attached to your visa\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Have enough money&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must have enough money to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003esupport yourself while you are in Australia\u003c/li\u003e\n\t\u003cli\u003eleave Australia at the end of your stay\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Best interests of the child&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe might not grant this visa if it is not in the best interests of an applicant under 18.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;criteria&quot;:[]}]},&quot;stepGuide&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eFollow this step by step guide.\u003c/p\u003e\n&quot;},&quot;steps&quot;:[{&quot;id&quot;:1,&quot;title&quot;:&quot;Apply for the visa&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eApply for the eVisitor online.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonLink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;title&quot;:&quot;Provide accurate information&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eDouble check all information is correct before you submit your application. This includes:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003emaking sure your name is spelt as it appears in your passport, including your middle name, and that it has not been auto-corrected by your device\u003c/li\u003e\n\t\u003cli\u003echecking you hold a valid passport from one of the countries \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/evisitor-651#Eligibility\&quot;\u003eeligible\u003c/a\u003e for the eVisitor\u003c/li\u003e\n\t\u003cli\u003echecking you have entered your date of birth in dd/mm/yy format\u003c/li\u003e\n\t\u003cli\u003echecking your email address has been entered correctly.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf your visa is granted with incorrect information, you may experience delays or be refused entry to Australia.\u003c/p\u003e\n\n\u003cp\u003eSee what happens if you \u003ca href=\&quot;/help-support/meeting-our-requirements/providing-accurate-information\&quot;\u003ecan\u0026#39;t prove your identity or don\u0026#39;t provide true information\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Character documents&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/character\&quot;\u003echaracter requirement\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you have a criminal conviction in any country, apply for a Visitor visa (subclass 600) instead. If you arrive in Australia on an eVisitor with a criminal conviction, you might be refused entry.\u003c/p\u003e\n\n\u003cp\u003eIf you still decide to apply for an eVisitor you must:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003edeclare all criminal conduct you have engaged in\u003c/li\u003e\n\t\u003cli\u003etruthfully answer all questions\u003c/li\u003e\n\t\u003cli\u003eprovide all requested information including details of the offence/s and any fines or sentence/s imposed.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eWe may ask you to provide a \u003ca href=\&quot;/help-support/meeting-our-requirements/character/#content-index-5\&quot;\u003epolice certificate\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Prepare your documents&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003ch5\u003eTranslate\u003c/h5\u003e\n\n\u003cp\u003eHave all non-English documents translated into English.\u003c/p\u003e\n\n\u003cp\u003eProvide original and translated documents in your application.\u003c/p\u003e\n\n\u003cp\u003eTranslators in Australia must be accredited by the \u003ca class=\&quot;external\&quot; href=\&quot;https://www.naati.com.au/\&quot; target=\&quot;_blank\&quot;\u003eNational Accreditation Authority for Translators and Interpreters\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eTranslators outside Australia do not have to be accredited. But on each translation, they must include their:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003efull name\u003c/li\u003e\n\t\u003cli\u003eaddress and telephone number\u003c/li\u003e\n\t\u003cli\u003equalifications and experience in the language they are translating\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThese details must be in English.\u003c/p\u003e\n\n\u003cp\u003eYou do not need to have any documents certified unless we ask you to.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Apply online&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003col\u003e\n\t\u003cli\u003e\u003ca href=\&quot;https://online.immi.gov.au/lusc/login\&quot;\u003eCreate your application\u003c/a\u003e.\u003c/li\u003e\n\t\u003cli\u003e\u003ca href=\&quot;/help-support/applying-online-or-on-paper/online\&quot;\u003eAttach your documents\u003c/a\u003e\u0026nbsp;and submit.\u003c/li\u003e\n\u003c/ol\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;id&quot;:3,&quot;title&quot;:&quot;After you apply&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know when we have received your application. If you don\u0026#39;t receive an email from us within 12 hours of applying, check your application status in \u003ca href=\&quot;https://online.immi.gov.au/lusc/login\&quot;\u003eImmiAccount\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eThere are other things you need to know and might need to do.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonlink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;title&quot;:&quot;Travel&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eDo not arrange to travel to Australia until we let you know in writing that we have granted you the visa.\u003c/p\u003e\n\n\u003cp\u003eYou must be outside Australia to be granted the eVisitor.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;title&quot;:&quot;Visa outcome&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know our decision on your visa application in writing. We will tell you:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyour visa grant number\u003c/li\u003e\n\t\u003cli\u003ethe date your visa starts\u003c/li\u003e\n\t\u003cli\u003eyour visa conditions\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eKeep a copy of our decision with you when in Australia.\u003c/p\u003e\n\n\u003cp\u003eIf we refuse your visa we will let you know in writing. We will tell you why we refused and whether you have a right to a review of the decision.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;Step Summary&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}],&quot;collapsed&quot;:false},&quot;haveThisVisa&quot;:{&quot;content&quot;:[{&quot;id&quot;:-1,&quot;text&quot;:&quot;Coming to Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eBefore you travel\u003c/h3\u003e\n\n\u003ch4\u003eCheck your travel documents\u003c/h4\u003e\n\n\u003cp\u003eYou must have:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea valid visa to enter Australia\u003c/li\u003e\n\t\u003cli\u003ea valid passport or other travel document\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003ch4\u003eComplete an Incoming Passenger Card\u003c/h4\u003e\n\n\u003cp\u003eEveryone who arrives in Australia must complete an \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/entering-and-leaving-australia/crossing-the-border/at-the-border/incoming-passenger-card-(ipc)\&quot;\u003eIncoming Passenger Card\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;In Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eWhat you must do on an eVisitor\u003c/h3\u003e\n\n\u003cp\u003eYou must meet all visa conditions and obey Australian laws. See your conditions in \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e or your visa grant letter.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=651\&quot;\u003evisa conditions\u003c/a\u003e and how they work.\u003c/p\u003e\n\n\u003ch3\u003eTell us about a change in your situation\u003c/h3\u003e\n\n\u003cp\u003eThings you need to let us know about include:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003echanges to your phone number, email, address or passport\u003c/li\u003e\n\t\u003cli\u003echanges to your relationship status\u003c/li\u003e\n\t\u003cli\u003ethe birth of a child\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eSee how to let us know if there is a \u003ca href=\&quot;/change-in-situation\&quot;\u003echange in your situation\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eWhat you can do on an eVisitor\u003c/h3\u003e\n\n\u003cp\u003eTravel to Australia:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eto cruise or for a holiday\u003c/li\u003e\n\t\u003cli\u003eto visit family or friends\u003c/li\u003e\n\t\u003cli\u003eas a business visitor\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can study or train for up to 3 months in total on the eVisitor visa. But if your main reason for travelling to Australia is study, a student visa might be more appropriate.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eNote\u003c/strong\u003e: Applicants who are seeking to train at a childcare centre, study to be a doctor, dentist, nurse or paramedic or enter health care or hospital environments should apply for the Visitor (subclass 600) visa and complete the relevant health checks.\u003c/p\u003e\n\n\u003ch4\u003eBusiness visitor\u003c/h4\u003e\n\n\u003cp\u003eAs a business visitor, you can:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003emake general business or employment enquiries\u003c/li\u003e\n\t\u003cli\u003einvestigate, negotiate, sign or review a business contract\u003c/li\u003e\n\t\u003cli\u003emake an official government visit\u003c/li\u003e\n\t\u003cli\u003etake part in a conference, trade fair or seminar. You cannot be paid by the organisers for taking part\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can\u0026#39;t:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ework for or provide services to a business or organisation\u003c/li\u003e\n\t\u003cli\u003esell goods or services to the public\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe eVisitor visa is not a work visa. You cannot perform paid work for an Australian employer. If you work or intend to work in Australia on an eVisitor visa, \u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ewe may cancel it\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eWe may remove you or refuse you entry to Australia.\u003c/p\u003e\n\n\u003cp\u003eTo work in Australia, you must hold an appropriate visa. See \u003ca href=\&quot;/visas/working-in-australia\&quot;\u003eWorking in Australia\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch4\u003eVolunteer work tourism schemes\u003c/h4\u003e\n\n\u003cp\u003eYou can\u0026#39;t work in Australia on an eVisitor visa, but you might be able to do\u0026nbsp;\u003ca class=\&quot;clickbot-glossary\&quot;\u003evolunteer work\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eTravel on an eVisitor\u003c/h3\u003e\n\n\u003cp\u003eThis is a temporary visa. The eVisitor visa is valid for travel to Australia for 12 months, starting from the date it is granted.\u003c/p\u003e\n\n\u003cp\u003eThe visa has multiple entry. You can leave and re-enter Australia as many times as you want while it is valid. You can stay in Australia for 3 months after each entry. If you want to stay longer than 3 months at a time, you must apply for a different visa that suits your circumstances.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia for long periods or make regular visits, we may ask you about your travel purpose next time you enter Australia. If we find you are not a genuine visitor, we may \u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancel\u003c/a\u003e your eVisitor visa.\u003c/p\u003e\n\n\u003cp\u003eSee how long you can stay and\u0026nbsp;when you must leave in \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eStay longer\u003c/h3\u003e\n\n\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending this visa. You must apply for another visa.\u003c/p\u003e\n\n\u003cp\u003eIf you want to have a further short stay or stay longer for a holiday you might be eligible for a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600/tourist-stream-onshore\&quot;\u003eVisitor visa (subclass 600) Tourist stream (apply in Australia)\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you want to stay longer for other reasons, you should be able to apply for a new visa that suits your circumstances.\u003c/p\u003e\n\n\u003cp\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eExplore your visa options\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia after your eVisitor visa ceases, and do not hold another visa to stay, you will become an unlawful non-citizen. We may remove you from Australia.\u003c/p\u003e\n\n\u003ch3\u003eProve you have a visa\u003c/h3\u003e\n\n\u003cp\u003eTo prove you have a visa and show your conditions to someone, use \u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Leaving Australia&quot;,&quot;block&quot;:&quot;\u003ch4\u003eCheck your travel documents\u003c/h4\u003e\n\n\u003cp\u003eYou must have a valid passport or other travel document to leave Australia.\u003c/p\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003ch4\u003eDepartures SmartGate\u003c/h4\u003e\n\n\u003cp\u003eWe have an automated process that uses facial recognition technology and your ePassport. You might be able to leave the airport faster if you use \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/smartgates\&quot;\u003eSmartGate\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eAfter you leave\u003c/h3\u003e\n\n\u003ch4\u003eInternational Movement Record\u003c/h4\u003e\n\n\u003cp\u003e\u003ca href=\&quot;https://immi.homeaffairs.gov.au/entering-and-leaving-australia/request-movement-records\&quot;\u003eRequest your international movement records\u003c/a\u003e to get proof of your travel in and out of Australia.\u003c/p\u003e\n&quot;}]}},&quot;sponsor&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;How to Apply&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you are a sponsor&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;sponsor things to note&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;With this visa, they can...&quot;,&quot;visaStay&quot;:&quot;This is a permanent visa. You can stay in Australia indefinitely&quot;,&quot;visaCost&quot;:&quot;sponsor visa cost&quot;,&quot;visaProcessingTime&quot;:&quot;sponsor visa processing time&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;Anchor Content 1&quot;,&quot;block&quot;:&quot;Block 1&quot;},{&quot;text&quot;:&quot;Anchor Content 2&quot;,&quot;block&quot;:&quot;Block 2&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\n        You must meet all of the following eligibility criteria to be eligible for this visa under the Temporary Residence Transition stream.\n        Answer the questions below to see if you meet them, and which requirements that apply to you.\n        &quot;},&quot;criteria&quot;:[{&quot;title&quot;:&quot;Health&quot;,&quot;subTitle&quot;:&quot;You must meet our health requirement&quot;,&quot;description&quot;:&quot;Here\u0027 the description health requirements&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Character&quot;,&quot;subTitle&quot;:&quot;You must meet our character requirement&quot;,&quot;description&quot;:&quot;Here\u0027 the description for character requirements&quot;,&quot;collapsed&quot;:true}]},&quot;stepGuide&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\n        You must meet all of the following eligibility criteria to be eligible for this visa under the Temporary Residence Transition stream.\n        Answer the questions below to see if you meet them, and which requirements that apply to you.\n        &quot;},&quot;steps&quot;:[{&quot;id&quot;:1,&quot;title&quot;:&quot;Sponsor step here&quot;,&quot;subTitle&quot;:&quot;Helping the employee getting the visa&quot;,&quot;description&quot;:&quot;Here\u0027 the description health requirements&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonLink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[]}]},&quot;haveThisVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;Anchor Content 1&quot;,&quot;block&quot;:&quot;Block 1&quot;},{&quot;text&quot;:&quot;Anchor Content 2&quot;,&quot;block&quot;:&quot;Block 2&quot;}]}},&quot;toggleData&quot;:{&quot;currentActor&quot;:1,&quot;primaryActorLabel&quot;:&quot;For Applicants&quot;,&quot;secondaryActorLabel&quot;:&quot;For Sponsors&quot;}}" />

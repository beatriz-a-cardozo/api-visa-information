<input type="hidden" name="ctl00$PlaceHolderMain$PageSchemaHiddenField$Input" id="ctl00_PlaceHolderMain_PageSchemaHiddenField_Input" value="{&quot;recommended&quot;:{&quot;cards&quot;:[{&quot;id&quot;:&quot;600-29B&quot;,&quot;itemName&quot;:&quot;600-29B&quot;}]},&quot;visaSubclassHeading&quot;:&quot;Subclass 601&quot;,&quot;title&quot;:&quot;Electronic Travel Authority &quot;,&quot;currentActor&quot;:1,&quot;multipleActors&quot;:false,&quot;description&quot;:&quot;Visit Australia as often as you wish in a 12-month period. Stay up to 3 months each time you enter Australia.\n&quot;,&quot;warning&quot;:&quot;&quot;,&quot;applicant&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Step by step&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you have this visa&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003eapply from outside Australia\u003c/li\u003e\n\t\u003cli\u003ehave an \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/electronic-travel-authority-601#Eligibility\&quot;\u003eeligible passport\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003euse the Australian ETA app\u003c/li\u003e\n\t\u003cli\u003ewatch the \u003ca href=\&quot;/visas/getting-a-visa/eta-and-aia-video-guides\&quot; target=\&quot;_blank\&quot;\u003eETA video guides\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;\u003cul\u003e\n\t\u003cli\u003evisit family or friends\u003c/li\u003e\n\t\u003cli\u003ecruise or have a holiday\u003c/li\u003e\n\t\u003cli\u003eundertake some\u0026nbsp;\u003ca class=\&quot;clickbot-glossary\&quot;\u003ebusiness visitor activities\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;visaStay&quot;:&quot;\u003cp\u003eUp to 3 months at a time\u003c/p\u003e\n&quot;,&quot;visaCost&quot;:&quot;\u003cp\u003eThere is a service charge of AUD20 to use the Australian ETA app. There is no other charge payable for an ETA.\u0026nbsp;\u003c/p\u003e\n&quot;,&quot;visaProcessingTime&quot;:&quot;\u003cp\u003eIn most cases we will tell you of the result of your ETA application immediately. Your application may take longer if you do not complete the application process correctly or we require further information.\u003c/p\u003e\n\n\u003cp\u003eWe suggest you do not make travel arrangements until we grant your ETA.\u003c/p\u003e\n&quot;,&quot;sellAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/see-your-visa-conditions?product=601\&quot; target=\&quot;_blank\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;seeAllConditions&quot;:&quot;\u003cp\u003e\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/see-your-visa-conditions?product=601\&quot;\u003eSee all conditions\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;withThisVisaHeading&quot;:&quot;With this visa you can&quot;,&quot;notesHeading&quot;:&quot;You must&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;With this visa you can&quot;,&quot;block&quot;:&quot;\u003cp\u003eTravel to Australia:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eas a tourist - for example,\u0026nbsp;to cruise or have a holiday\u0026nbsp;\u003c/li\u003e\n\t\u003cli\u003eto visit family or friends\u003c/li\u003e\n\t\u003cli\u003eas a business visitor\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can study or train for up to 3 months in total on this visa. If your main reason for travelling to Australia is to study, you should apply for\u0026nbsp;a student visa.\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eNote\u003c/strong\u003e: You should apply for a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot; target=\&quot;_blank\&quot;\u003eVisitor (subclass 600) visa\u003c/a\u003e and complete the relevant health checks if you are seeking to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003etrain at a childcare centre\u003c/li\u003e\n\t\u003cli\u003estudy to be a doctor, dentist, nurse or paramedic\u003c/li\u003e\n\t\u003cli\u003eenter health care or hospital environments.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eCruise\u003c/h3\u003e\n\n\u003cp\u003eYou will need a visa if you enter Australia during a cruise.\u003c/p\u003e\n\n\u003cp\u003eIf your cruise is a \u003ca class=\&quot;clickbot-glossary\&quot;\u003eround trip cruise\u003c/a\u003e starting from Australia, the time you spend on the cruise counts as time spent in Australia - that is, we do not consider you have left Australia. A round trip cruise will not reset your stay period on your visa.\u003c/p\u003e\n\n\u003cp\u003eAsk your cruise operator or travel agent if we consider your cruise to be a round trip cruise.\u003c/p\u003e\n\n\u003ch3\u003eBusiness visitor\u003c/h3\u003e\n\n\u003cp\u003eAs a business visitor, you can:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003emake general business or employment enquiries\u003c/li\u003e\n\t\u003cli\u003einvestigate, negotiate, enter into or review a business contract\u003c/li\u003e\n\t\u003cli\u003econduct activities as part of an official government visit\u003c/li\u003e\n\t\u003cli\u003etake part in a conference, trade fair or seminar. The organisers can\u0026#39;t pay you to take part.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can\u0026#39;t:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ework for or provide services to a business or organisation based in Australia\u003c/li\u003e\n\t\u003cli\u003esell goods or services directly to the public\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe ETA is not a work visa. You cannot undertake paid work for an Australian employer. If you work or intend to work in Australia on an ETA, your ETA may be \u003ca href=\&quot;/visas/cancelling-a-visa\&quot; target=\&quot;_blank\&quot;\u003ecancelled\u003c/a\u003e. You may be removed or refused entry to Australia.\u003c/p\u003e\n\n\u003cp\u003eTo work in Australia, you must hold a visa that permits you to work. See \u003ca href=\&quot;/visas/working-in-australia\&quot;\u003eWorking in Australia\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;text&quot;:&quot;How long you can stay&quot;,&quot;block&quot;:&quot;\u003cp\u003eThis is a temporary visa. It is valid for travel to Australia for either 12 months, or for\u0026nbsp;the period your passport is valid, whichever is shorter.\u003c/p\u003e\n\n\u003cp\u003eThe visa is granted with multiple entry. You can leave and re-enter Australia as many times as you want while it is valid. You can remain in Australia for 3 months after each entry.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia for long periods or make frequent visits to Australia, we may ask you about your travel purpose next time you enter Australia. If you are found not to be a genuine visitor, your ETA may be \u003ca href=\&quot;/visas/cancelling-a-visa\&quot; target=\&quot;_blank\&quot;\u003ecancelled\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you want to stay longer than 3 months at a time, you need to apply for a different visa that suits your circumstances.\u003c/p\u003e\n\n\u003cp\u003eThe 12 month visa period starts on the date it is granted unless you hold another substantive visa that is already in effect.\u0026nbsp;\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Stay longer&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending this visa. You must apply for another visa.\u003c/p\u003e\n\n\u003cp\u003eTo find out about other visas, \u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eexplore your visa options\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you remain in Australia after your ETA ceases, and do not hold another visa to remain, you will become an unlawful non-citizen and you may be removed from Australia.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Including family&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can\u0026#39;t include family members, such as children or your spouse, in your application. Each family member, including those listed on your passport, must submit a separate application.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Cost&quot;,&quot;block&quot;:&quot;\u003cp\u003eThere is no Visa Application Charge (VAC) however there is an application service fee of AUD20 to use the Australian ETA app.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Apply from&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou must be outside Australia when you apply for the ETA and outside Australia when the visa is granted.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Processing times&quot;,&quot;block&quot;:&quot;\u003cp\u003eIn most cases, you will be notified of the result of your ETA application immediately.\u003c/p\u003e\n\n\u003cp\u003eYour application might take longer to process if:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyou don\u0026#39;t answer the questions in the ETA app correctly\u003c/li\u003e\n\t\u003cli\u003ewe need more information from you\u003c/li\u003e\n\t\u003cli\u003eyour information is hard to verify.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eWe suggest you do not make travel arrangements until your ETA has been granted.\u003c/p\u003e\n\n\u003cp\u003eIf you have a criminal conviction in any country, we will need more information from you. You should apply for a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot; target=\&quot;_blank\&quot;\u003eVisitor visa (subclass 600)\u003c/a\u003e and provide evidence about your criminal convictions.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Your obligations&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou must meet all visa conditions and obey Australian laws.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Health insurance&quot;,&quot;block&quot;:&quot;\u003cp\u003eWe recommend you take out health insurance to cover any unforeseen medical treatment you might need in Australia. You are personally liable for all your healthcare costs while you are in Australia. Insurance can help limit your financial liability.\u003c/p\u003e\n\n\u003cp\u003eSee what we consider \u003ca href=\&quot;/help-support/meeting-our-requirements/health/adequate-health-insurance\&quot;\u003eadequate health insurance\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eLearn more about \u003ca class=\&quot;external\&quot; href=\&quot;https://www.privatehealth.gov.au/health_insurance/overseas/index.htm\&quot;\u003ehealth insurance for overseas visitors\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eReciprocal healthcare agreements\u003c/h3\u003e\n\n\u003cp\u003eSome countries have a reciprocal healthcare agreement with Australia. Find out more from Services Australia\u0026nbsp;about \u003ca class=\&quot;external\&quot; href=\&quot;https://www.servicesaustralia.gov.au/when-reciprocal-health-care-agreements-apply-and-you-visit-australia?context=22481\&quot;\u003ereciprocal healthcare agreements\u003c/a\u003e.\u0026nbsp;\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Travel&quot;,&quot;block&quot;:&quot;\u003cp\u003eYou can travel outside Australia and return as many times as you want while the visa is valid.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Visa label&quot;,&quot;block&quot;:&quot;\u003cp\u003eWe will digitally link your visa to your passport. You will not get a label in your passport.​​\u003c/p\u003e\n\n\u003cp\u003eYour ETA is attached to your current passport. If your current passport expires or you get a new passport:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyour ETA will cease\u003c/li\u003e\n\t\u003cli\u003eyou must apply for a new ETA\u003c/li\u003e\n\u003c/ul\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Other visas&quot;,&quot;block&quot;:&quot;\u003ch3\u003eMaritime Crew visa or Special Purpose visa\u003c/h3\u003e\n\n\u003cp\u003eIf you hold a Maritime Crew visa or a Special Purpose visa and you are granted an ETA, you will hold both visas concurrently. When you arrive in Australia,\u0026nbsp;you will enter on both visas. You can stay in Australia for the longer of the 2 visa periods.\u003c/p\u003e\n\n\u003cp\u003eIf the longer period exceeds 3 months the ETA will cease, but you can remain for the duration of the other visa\u0026#39;s stay period.\u003c/p\u003e\n\n\u003ch3\u003eAny other substantive visa\u003c/h3\u003e\n\n\u003cp\u003eIf you hold any other substantive visa and an ETA when you arrive in Australia, you will enter Australia on your other substantive visa, not your ETA. Your ETA will come into effect when the other visa ceases.\u003c/p\u003e\n\n\u003cp\u003eHowever, the 3-month ETA stay period still begins when you enter Australia.\u003c/p\u003e\n\n\u003cp\u003eCheck your other substantive visa is valid for more than 3 months if you want to stay in Australia longer than the 3-month ETA stay period.\u003c/p\u003e\n&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eYou must meet all of these criteria to be eligible for an\u0026nbsp;Electronic Travel Authority.\u0026nbsp;\u003c/p\u003e\n&quot;},&quot;criteria&quot;:[{&quot;title&quot;:&quot;Have an eligible passport&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eYou must hold a valid passport from one of these countries or jurisdictions to be eligible for an ETA. You cannot apply for an ETA with a non-citizen passport, certificate of identity or other travel document, such as a Titre de Voyage.\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eAndorra\u003c/li\u003e\n\t\u003cli\u003eAustria\u003c/li\u003e\n\t\u003cli\u003eBelgium\u003c/li\u003e\n\t\u003cli\u003eBrunei\u003c/li\u003e\n\t\u003cli\u003eCanada\u003c/li\u003e\n\t\u003cli\u003eDenmark\u003c/li\u003e\n\t\u003cli\u003eFinland\u003c/li\u003e\n\t\u003cli\u003eFrance\u003c/li\u003e\n\t\u003cli\u003eGermany\u003c/li\u003e\n\t\u003cli\u003eGreece\u003c/li\u003e\n\t\u003cli\u003eHong Kong (SAR of China)\u003c/li\u003e\n\t\u003cli\u003eIceland\u003c/li\u003e\n\t\u003cli\u003eIreland\u003c/li\u003e\n\t\u003cli\u003eItaly\u003c/li\u003e\n\t\u003cli\u003eJapan\u003c/li\u003e\n\t\u003cli\u003eLiechtenstein\u003c/li\u003e\n\t\u003cli\u003eLuxembourg\u003c/li\u003e\n\t\u003cli\u003eMalaysia\u003c/li\u003e\n\t\u003cli\u003eMalta\u003c/li\u003e\n\t\u003cli\u003eMonaco\u003c/li\u003e\n\t\u003cli\u003eNorway\u003c/li\u003e\n\t\u003cli\u003ePortugal\u003c/li\u003e\n\t\u003cli\u003eRepublic of San Marino\u003c/li\u003e\n\t\u003cli\u003eSingapore\u003c/li\u003e\n\t\u003cli\u003eSouth Korea\u003c/li\u003e\n\t\u003cli\u003eSpain\u003c/li\u003e\n\t\u003cli\u003eSweden\u003c/li\u003e\n\t\u003cli\u003eSwitzerland\u003c/li\u003e\n\t\u003cli\u003eTaiwan (excluding official or diplomatic passports)\u003c/li\u003e\n\t\u003cli\u003eThe Netherlands\u003c/li\u003e\n\t\u003cli\u003eUnited Kingdom\u0026mdash;British Citizen\u003c/li\u003e\n\t\u003cli\u003eUnited Kingdom\u0026mdash;British National (Overseas)\u003c/li\u003e\n\t\u003cli\u003eUnited States of America\u003c/li\u003e\n\t\u003cli\u003eVatican City\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf you hold more than one passport, you must declare this in your ETA application and provide details of your other passports.\u003c/p\u003e\n\n\u003cp\u003eIf you hold an ETA eligible passport, but you are also an Australian citizen, you cannot\u0026nbsp;apply for an ETA. Australian citizens have an automatic right of entry and do not need a visa to enter Australia. See \u003ca href=\&quot;/entering-and-leaving-australia/traveling-as-a-dual-citizen\&quot; target=\&quot;_blank\&quot;\u003eTravelling as a dual citizen\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;criteria&quot;:[]},{&quot;title&quot;:&quot;Be a genuine visitor&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must only intend\u0026nbsp;to stay temporarily in Australia and obey any condition or stay period attached to your visa.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;criteria&quot;:[]},{&quot;title&quot;:&quot;Meet our health requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our \u003ca href=\&quot;/help-support/meeting-our-requirements/health\&quot;\u003ehealth requirement\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eWhere a visa applicant has previously\u0026nbsp;\u003cstrong\u003efailed to meet\u0026nbsp;\u003c/strong\u003ethe \u003ca href=\&quot;/help-support/meeting-our-requirements/health\&quot;\u003ehealth requirement\u003c/a\u003e, the most appropriate visa for these applicants is a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot;\u003eVisitor (subclass 600) visa.\u003c/a\u003e\u003c/p\u003e\n\n\u003cp\u003eIf you will be entering health care or hospital environments, you should apply for a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot; target=\&quot;_blank\&quot;\u003eVisitor (subclass 600) visa\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Meet our character requirement&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eYou must meet our\u0026nbsp;\u003ca href=\&quot;/help-support/meeting-our-requirements/character\&quot;\u003echaracter requirement\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you have a criminal conviction in any country, you should\u0026nbsp;apply for a\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot;\u003eVisitor visa (subclass 600)\u003c/a\u003e\u0026nbsp;and provide evidence about your criminal convictions.\u003c/p\u003e\n\n\u003cp\u003eIf you are granted an ETA, but we find that you provided incorrect information, your ETA may be\u0026nbsp;\u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancelled\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Have paid back debt to the Australian Government&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eIf you or any family members (including those who don\u0026#39;t apply for the visa with you) owe the Australian Government money, you or they must have paid\u0026nbsp;it back or have arranged to pay it back.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true},{&quot;title&quot;:&quot;Best interests of the child&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe might not grant this visa if it is not in the best interests of an applicant under 18.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;criteria&quot;:[]}]},&quot;stepGuide&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\u003cp\u003eYou must meet all of the following eligibility criteria to be eligible for this visa.\u0026nbsp;\u003c/p\u003e\n&quot;},&quot;steps&quot;:[{&quot;title&quot;:&quot;Before you apply&quot;,&quot;subTitle&quot;:&quot;\u003col\u003e\n\t\u003cli\u003eCheck you have a valid passport.\u003c/li\u003e\n\t\u003cli\u003eDownload the Australian ETA app for free from the \u003ca class=\&quot;external\&quot; href=\&quot;https://apps.apple.com/au/app/australianeta/id1527982364\&quot; target=\&quot;_blank\&quot;\u003eApple Store (Apple)\u003c/a\u003e or \u003ca class=\&quot;external\&quot; href=\&quot;https://play.google.com/store/apps/details?id=au.gov.homeaffairs.eta\u0026amp;hl=en_AU\u0026amp;gl=US\&quot;\u003eGoogle Play Store (Android)\u003c/a\u003e.\u003c/li\u003e\n\t\u003cli\u003eWatch the \u003ca href=\&quot;/visas/getting-a-visa/eta-and-aia-video-guides\&quot; target=\&quot;_blank\&quot;\u003eETA and AIA video guides\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch3\u003eHelp with your application\u003c/h3\u003e\n\n\u003cp\u003eTravel industry representatives can use the Australian ETA app to help you apply. They must take a live facial image of you when they lodge the application. We will not grant you a visa if you do not take a live image.\u003c/p\u003e\n\n\u003cp\u003eMore information for industry representatives is available at:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (English)\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance-japanese.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (Japanese)\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance-korean.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (Korean)\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[],&quot;customButtonText&quot;:&quot;&quot;,&quot;hasCustomButton&quot;:false,&quot;customButtonLink&quot;:&quot;&quot;},{&quot;id&quot;:1,&quot;title&quot;:&quot;Apply for the visa&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonLink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;title&quot;:&quot;Apply using the Australian ETA app&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eTo apply for an ETA using the Australian ETA app, you need to have:\u003c/p\u003e\n\n\u003col\u003e\n\t\u003cli\u003eA mobile device with a camera which can take your photo and an image of the Passport data page.\u003c/li\u003e\n\t\u003cli\u003eNear-field communication (NFC) enabled on your mobile device.\u003c/li\u003e\n\t\u003cli\u003eLocation services enabled on your mobile device.\u003c/li\u003e\n\t\u003cli\u003eA valid email address.\u003c/li\u003e\n\t\u003cli\u003eA valid payment method ready to pay the service fee.\u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eYou can\u0026#39;t include family members in your application. Each family member, including those listed on your passport, must submit a separate application. If all family members apply using the same mobile device, you can submit and pay for the applications at the same time.\u003c/p\u003e\n\n\u003cp\u003eYou can get help from a friend or family member to apply through the app but you must be physically with them when you apply. Authorised travel agents and industry representatives can also make an ETA application on your behalf using the app.\u003c/p\u003e\n\n\u003cp\u003eMore information for industry representatives is available at:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (English)\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance-japanese.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (Japanese)\u003c/a\u003e\u003c/li\u003e\n\t\u003cli\u003e\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/supporting/files/australian-eta-app-industry-guidance-korean.pdf\&quot;\u003eAustralian ETA app - Guidance notes for industry users (Korean)\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf an agent applies\u0026nbsp;on your behalf, you must still be physically present when they make the application. You will need to take\u0026nbsp;your photo and have your passport available to scan.\u003c/p\u003e\n\n\u003cp\u003eAfter you have downloaded and opened the app on your mobile device, you need to:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003escan your passport to pre-fill your name, date of birth, passport number and other details\u003c/li\u003e\n\t\u003cli\u003etake a photo of yourself\u003c/li\u003e\n\t\u003cli\u003eanswer some questions, including whether you have any criminal convictions, any prior names and contact details in Australia\u003c/li\u003e\n\t\u003cli\u003epay the service fee\u003c/li\u003e\n\t\u003cli\u003esubmit the application.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eNote: \u003c/strong\u003eYou must check that all details of your application, including name and date of birth, are correct before submitting your application. You must also check that you have answered all questions in the app correctly.\u003c/p\u003e\n\n\u003cp\u003eIf you need more help, check the Frequently Asked Questions in the app.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Other ways to apply&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eIf you are ineligible or unable to apply for an ETA using the Australian ETA app, you can apply online for another visa that suits your needs through \u003ca href=\&quot;https://online.immi.gov.au/lusc/login\&quot;\u003eImmiAccount\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eEuropean passport holders may be eligible for an\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/evisitor-651\&quot; target=\&quot;_blank\&quot;\u003eeVisitor (subclass 651) visa\u003c/a\u003e.\u003cbr /\u003e\nThere is no charge to make an eVisitor visa application.\u003c/p\u003e\n\n\u003cp\u003eOther passport holders may be eligible for a \u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot; target=\&quot;_blank\&quot;\u003eVisitor (subclass 600) visa\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]},{&quot;title&quot;:&quot;Provide accurate information&quot;,&quot;subTitle&quot;:&quot;&quot;,&quot;description&quot;:&quot;\u003cp\u003eWhen applying, you must truthfully answer all questions. This includes declaring:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eif you hold any other passports\u003c/li\u003e\n\t\u003cli\u003eif you have been known by any other name\u003c/li\u003e\n\t\u003cli\u003eany criminal conviction or domestic violence history.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf you do not\u0026nbsp;\u003ca href=\&quot;/help-support/meeting-our-requirements/providing-accurate-information\&quot;\u003eprovide accurate information\u003c/a\u003e, we may \u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancel your ETA.\u003c/a\u003e\u003c/p\u003e\n\n\u003cp\u003eIf your ETA details do not exactly match your passport details, you might experience delays when boarding your aircraft or be refused entry in Australia.\u003c/p\u003e\n\n\u003cp\u003eWe cannot change the details on an ETA once it has been issued.\u003c/p\u003e\n\n\u003cp\u003eWe suggest you do not make travel arrangements until we grant your ETA.\u003c/p\u003e\n\n\u003cp\u003eFind out what you can do to \u003ca href=\&quot;/visas/getting-a-visa/check-twice-submit-once\&quot;\u003ehelp us process your application faster\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;id&quot;:3,&quot;title&quot;:&quot;After you apply&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eIn most cases, we will tell you of the result of your ETA application immediately. Sometimes there will be a delay before you receive your notification. Check your emails, including your junk mail folder\u0026nbsp;for a written notification from us.\u003c/p\u003e\n\n\u003cp\u003eYour application might take longer to process if:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyou don\u0026#39;t fill it in correctly\u003c/li\u003e\n\t\u003cli\u003ewe need more information from you\u003c/li\u003e\n\t\u003cli\u003eyour information is hard to verify.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf you have a criminal conviction in any country, we will need more information from you. You should\u0026nbsp;apply for a\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/visitor-600\&quot; target=\&quot;_blank\&quot;\u003eVisitor (subclass 600) visa\u003c/a\u003e\u0026nbsp;and provide evidence about your criminal convictions.\u0026nbsp;\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;hasCustomButton&quot;:false,&quot;customButtonlink&quot;:&quot;&quot;,&quot;customButtonText&quot;:&quot;&quot;,&quot;steps&quot;:[{&quot;title&quot;:&quot;Travel&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eDon\u0026#39;t arrange to travel to Australia until we let you know, in writing, that we have granted you the visa.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}]},{&quot;title&quot;:&quot;Visa outcome&quot;,&quot;subTitle&quot;:&quot;\u003cp\u003eWe will let you know our decision on your visa application in writing. If the visa is granted we will tell you:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyour visa grant number\u003c/li\u003e\n\t\u003cli\u003ethe date your visa starts\u003c/li\u003e\n\t\u003cli\u003eyour visa conditions.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou should keep a copy of our decision with you while in Australia.\u003c/p\u003e\n\n\u003cp\u003eIf we refuse your visa we will let you know in writing. We will tell you why we refused your visa and whether you have a right to a review of the decision.\u003c/p\u003e\n\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\n\u003ch3\u003eIf your application cannot be processed or approved without further information.\u003c/h3\u003e\n\n\u003cp\u003eYou will receive a letter detailing how to provide this information. You must:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003euse the link in the letter\u0026nbsp;to submit an online form directly in ImmiAccount\u003c/li\u003e\n\t\u003cli\u003eanswer all questions in the online form and attach the required supporting documentation\u003c/li\u003e\n\t\u003cli\u003ecomplete and attach\u0026nbsp;\u003ca class=\&quot;data-getfilesize\&quot; href=\&quot;/form-listing/forms/1554.pdf\&quot;\u003eForm 1554: ETA Request for further processing\u003c/a\u003e\u0026nbsp;to the online form.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf we cannot process your application without more\u0026nbsp;information, you can consider applying for another visa that is suitable for your travel needs. See\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eexplore your visa options\u003c/a\u003e\u003c/p\u003e\n\n\u003cp\u003eDo not submit further ETA applications through the Australian ETA app. You will receive the same results.\u003c/p\u003e\n&quot;,&quot;description&quot;:&quot;Step Summary&quot;,&quot;collapsed&quot;:true,&quot;steps&quot;:[]}],&quot;collapsed&quot;:false},&quot;haveThisVisa&quot;:{&quot;content&quot;:[{&quot;id&quot;:-1,&quot;text&quot;:&quot;Coming to Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eBefore you travel\u003c/h3\u003e\n\n\u003ch4\u003eCheck your travel documents\u003c/h4\u003e\n\n\u003cp\u003eYou must have:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ea valid visa to enter Australia\u003c/li\u003e\n\t\u003cli\u003ea valid passport or other travel document.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYour ETA is electronically linked to the passport you used to apply for your ETA. You must enter Australia using the same passport. If this passport expires or you get a new passport:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eyour ETA will cease\u003c/li\u003e\n\t\u003cli\u003eyou must apply for a new ETA.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003ch4\u003eComplete an Incoming Passenger Card\u0026nbsp;\u003c/h4\u003e\n\n\u003cp\u003eEveryone who arrives in Australia must complete an\u0026nbsp;\u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/entering-and-leaving-australia/crossing-the-border/at-the-border/incoming-passenger-card-(ipc)\&quot;\u003eIncoming Passenger Card\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch4\u003eUsing the SmartGate\u003c/h4\u003e\n\n\u003cp\u003eA SmartGate is an automated process that uses facial recognition technology and your ePassport. You might be able to leave the airport faster if you use\u0026nbsp;\u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/smartgates\&quot;\u003eSmartGate\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;In Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eWhat you must do on an ETA\u003c/h3\u003e\n\n\u003cp\u003eYou must meet all visa conditions and obey Australian laws. See your conditions in your visa grant letter or\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you breach any visa conditions, your ETA may be\u0026nbsp;\u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancelled\u003c/a\u003e. You may be removed or refused entry to Australia.\u003c/p\u003e\n\n\u003ch3\u003eCheck your ETA status and details\u003c/h3\u003e\n\n\u003cp\u003eYou can check the details and status of your ETA in\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eYou can also check the status of your application on the Australian ETA App by using the \u0026ldquo;Visa check\u0026rdquo; function.\u003c/p\u003e\n\n\u003ch3\u003eTell us about a change in your situation\u003c/h3\u003e\n\n\u003cp\u003eYour ETA is electronically linked to the passport you used to apply for your ETA. You must enter Australia using the same passport. If this passport expires or you get a new passport, your ETA will cease and you must apply for a new ETA.\u003c/p\u003e\n\n\u003ch3\u003eWhat you can do on an ETA\u003c/h3\u003e\n\n\u003cp\u003eYou can travel to Australia:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003eto visit family or friends\u003c/li\u003e\n\t\u003cli\u003eas a tourist - for example, to cruise or have a holiday\u003c/li\u003e\n\t\u003cli\u003eas a business visitor.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can study or train for up to 3 months in total on an ETA. If your main reason for travelling to Australia is to study, you should apply for a student visa.\u003c/p\u003e\n\n\u003ch4\u003eBusiness visitor\u003c/h4\u003e\n\n\u003cp\u003eAs a business visitor, you can:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003emake general business or employment enquiries\u003c/li\u003e\n\t\u003cli\u003einvestigate, negotiate, enter into or review a business contract\u003c/li\u003e\n\t\u003cli\u003econduct activities as part of an official government visit\u003c/li\u003e\n\t\u003cli\u003etake part in a conference, trade fair or seminar. The organisers can\u0026#39;t pay you to take part.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can\u0026#39;t:\u003c/p\u003e\n\n\u003cul\u003e\n\t\u003cli\u003ework for or provide services to a business or organisation based in Australia\u003c/li\u003e\n\t\u003cli\u003esell goods or services directly to the public.\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf you want to work in Australia, you need to apply for a visa that allows work.\u003c/p\u003e\n\n\u003cp\u003eTo see your specific conditions use\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eIf you work or intend to work in Australia on an ETA, or breach your visa conditions, your ETA may be\u0026nbsp;\u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancelled\u003c/a\u003e. You may be removed or refused entry to Australia.\u003c/p\u003e\n\n\u003ch3\u003eTravel on your visa\u003c/h3\u003e\n\n\u003cp\u003eThe ETA is granted with multiple entry. You can leave and re-enter Australia as many times as you want while it is valid. You can stay in Australia for up to 3 months on each entry.\u003c/p\u003e\n\n\u003cp\u003eIf you stay in Australia for long periods or make frequent visits to Australia, we may ask you about your travel purpose next time you enter Australia. If you are found not to be a genuine visitor, your ETA may be\u0026nbsp;\u003ca href=\&quot;/visas/cancelling-a-visa\&quot;\u003ecancelled\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eSee how long you can stay\u003c/h3\u003e\n\n\u003cp\u003eSee when you must leave in\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eStaying longer\u003c/h3\u003e\n\n\u003cp\u003eYou can\u0026#39;t stay in Australia longer by extending an ETA. You must apply for a new visa if you want to stay longer.\u0026nbsp;\u003ca href=\&quot;/visas/getting-a-visa/visa-finder\&quot;\u003eSee your options\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eProve you have a visa\u003c/h3\u003e\n\n\u003cp\u003eTo prove you have an ETA\u0026nbsp;and show your conditions to someone, use\u0026nbsp;\u003ca href=\&quot;/visas/already-have-a-visa/check-visa-details-and-conditions/overview\&quot;\u003eVEVO\u003c/a\u003e.\u003c/p\u003e\n&quot;},{&quot;id&quot;:-1,&quot;text&quot;:&quot;Leaving Australia&quot;,&quot;block&quot;:&quot;\u003ch3\u003eBefore you leave\u0026nbsp;\u003c/h3\u003e\n\n\u003ch4\u003eCheck your travel documents\u003c/h4\u003e\n\n\u003cp\u003eYou must have a valid passport or other travel document to leave Australia.\u003c/p\u003e\n\n\u003ch3\u003eAt the border\u003c/h3\u003e\n\n\u003ch4\u003eDepartures SmartGate\u003c/h4\u003e\n\n\u003cp\u003eWe have an automated process that uses facial recognition technology and your ePassport. You might be able to leave the airport faster if you use \u003ca class=\&quot;external\&quot; href=\&quot;https://www.abf.gov.au/smartgates\&quot;\u003eSmartGate\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch3\u003eAfter you leave\u003c/h3\u003e\n\n\u003ch4\u003eInternational Movement Record\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/h4\u003e\n\n\u003cp\u003eTo get proof of your travel in and out of Australia, \u003ca href=\&quot;/entering-and-leaving-australia/request-movement-records\&quot;\u003erequest your international movement records\u003c/a\u003e.\u003c/p\u003e\n&quot;}]}},&quot;sponsor&quot;:{&quot;tabs&quot;:{&quot;data&quot;:[{&quot;text&quot;:&quot;Overview&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;About this visa&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;Eligibility&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;How to Apply&quot;,&quot;hidden&quot;:false},{&quot;text&quot;:&quot;When you are a sponsor&quot;,&quot;hidden&quot;:false}]},&quot;overview&quot;:{&quot;processTitle&quot;:&quot;Process&quot;,&quot;notes&quot;:&quot;sponsor things to note&quot;,&quot;processMap&quot;:&quot;&quot;,&quot;withThisVisa&quot;:&quot;With this visa, they can...&quot;,&quot;visaStay&quot;:&quot;This is a permanent visa. You can stay in Australia indefinitely&quot;,&quot;visaCost&quot;:&quot;sponsor visa cost&quot;,&quot;visaProcessingTime&quot;:&quot;sponsor visa processing time&quot;},&quot;aboutVisa&quot;:{&quot;content&quot;:[{&quot;text&quot;:&quot;Anchor Content 1&quot;,&quot;block&quot;:&quot;Block 1&quot;},{&quot;text&quot;:&quot;Anchor Content 2&quot;,&quot;block&quot;:&quot;Block 2&quot;}]},&quot;eligibility&quot;:{&quot;callToAction&quot;:{&quot;body&quot;:&quot;\n        Yo
